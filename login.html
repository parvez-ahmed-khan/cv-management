<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CV Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="split-container">
    <div class="split-brand">
      <h1>CV Management System</h1>
      <p>Welcome back. Log in to continue building your professional CV.</p>
      <ul class="brand-features">
        <li>Multiple professional templates</li>
        <li>Live preview as you type</li>
        <li>Download as PDF anytime</li>
      </ul>
    </div>

    <div class="split-form">
      <div class="auth-box">
        <h2>Login to your account</h2>
        <form id="loginForm" novalidate>
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required>
          <button type="submit">Login</button>
        </form>
        <p id="message"></p>
        <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');

      if (!email || !password) {
        messageEl.textContent = "Please fill in all fields.";
        messageEl.style.color = "red";
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          messageEl.textContent = "Login successful! Redirecting...";
          messageEl.style.color = "green";
          setTimeout(() => window.location.href = "dashboard.html", 1000);
        })
        .catch((error) => {
          messageEl.textContent = "Error: " + error.message;
          messageEl.style.color = "red";
        });
    });
  </script>
</body>
</html>
