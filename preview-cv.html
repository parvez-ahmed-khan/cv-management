<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Preview - CV Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="preview-wrapper">
    <div class="preview-toolbar">
      <a href="dashboard.html" class="back-link">Back to Dashboard</a>
      <div id="actionButtons" style="display:none;">
        <a href="update-cv.html" class="btn-small">Edit CV</a>
        <button onclick="window.print()" class="btn-small">Print / Download PDF</button>
        <button onclick="deleteCV()" class="btn-small btn-danger">Delete CV</button>
      </div>
    </div>

    <div class="cv-sheet" id="cvSheet">
      <p id="loadingMsg">Loading your CV...</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    let cvExists = false;

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      db.collection('cvs').doc(user.uid).get().then((doc) => {
        const sheet = document.getElementById('cvSheet');

        if (!doc.exists) {
          cvExists = false;
          document.getElementById('actionButtons').style.display = 'none';
          sheet.innerHTML = "<p>You haven't created a CV yet. <a href='create-cv.html'>Create one now</a>.</p>";
          return;
        }

        cvExists = true;
        document.getElementById('actionButtons').style.display = 'flex';

        const cv = doc.data();
        sheet.className = 'cv-sheet template-' + (cv.template || 'modern');

        if (cv.template === 'sidebar') {
          const skillsItems = cv.skills ? cv.skills.split(',').map(s => `<li>${s.trim()}</li>`).join('') : '';

          let leftCol = `<div class="sidebar-left">
            <div class="sidebar-photo">${cv.photo ? `<img src="${cv.photo}" alt="photo">` : `<div class="sidebar-photo-placeholder">Photo</div>`}</div>
            <div class="sidebar-block"><h4>Contact</h4>
              ${cv.phone ? `<p>${cv.phone}</p>` : ''}
              ${cv.email ? `<p>${cv.email}</p>` : ''}
              ${cv.address ? `<p>${cv.address}</p>` : ''}
            </div>
            ${skillsItems ? `<div class="sidebar-block"><h4>Skills</h4><ul>${skillsItems}</ul></div>` : ''}
            ${(cv.education && (cv.education.degree || cv.education.institution)) ? `
            <div class="sidebar-block"><h4>Education</h4>
              <p><strong>${cv.education.degree || ''}</strong></p>
              <p>${cv.education.institution || ''} ${cv.education.year ? '- ' + cv.education.year : ''}</p>
            </div>` : ''}
            ${(cv.reference && cv.reference.name) ? `
            <div class="sidebar-block"><h4>Reference</h4>
              <p><strong>${cv.reference.name}</strong></p>
              ${cv.reference.title ? `<p>${cv.reference.title}</p>` : ''}
              ${cv.reference.email ? `<p>${cv.reference.email}</p>` : ''}
              ${cv.reference.phone ? `<p>${cv.reference.phone}</p>` : ''}
            </div>` : ''}
          </div>`;

          let rightCol = `<div class="sidebar-right"><h1>${cv.fullName || ''}</h1>`;
          if (cv.summary) rightCol += `<div class="cv-section"><h3>Summary</h3><p>${cv.summary}</p></div>`;

          const hasExp1 = cv.experience && cv.experience.jobTitle;
          const hasExp2 = cv.experience2 && cv.experience2.jobTitle;

          if (hasExp1 || hasExp2) {
            rightCol += `<div class="cv-section"><h3>Work History</h3>`;
            if (hasExp1) {
              rightCol += `<div class="sidebar-job">
                <p class="job-title">${cv.experience.jobTitle} ${cv.experience.period ? `<span class="job-period">${cv.experience.period}</span>` : ''}</p>
                <p class="job-company">${cv.experience.company || ''}</p>
                <p>${cv.experience.description || ''}</p>
              </div>`;
            }
            if (hasExp2) {
              rightCol += `<div class="sidebar-job">
                <p class="job-title">${cv.experience2.jobTitle} ${cv.experience2.period ? `<span class="job-period">${cv.experience2.period}</span>` : ''}</p>
                <p class="job-company">${cv.experience2.company || ''}</p>
                <p>${cv.experience2.description || ''}</p>
              </div>`;
            }
            rightCol += `</div>`;
          }
          rightCol += `</div>`;

          sheet.innerHTML = leftCol + rightCol;

        } else {
          const skillsList = cv.skills ? cv.skills.split(',').map(s => `<span class="skill-tag">${s.trim()}</span>`).join('') : '';
          const hasExp1 = cv.experience && cv.experience.jobTitle;
          const hasExp2 = cv.experience2 && cv.experience2.jobTitle;
          const hasRef = cv.reference && cv.reference.name;

          sheet.innerHTML = `
            <div class="cv-header">
              <h1>${cv.fullName || ''}</h1>
              <p>${cv.email || ''} | ${cv.phone || ''} | ${cv.address || ''}</p>
            </div>

            ${cv.summary ? `<div class="cv-section"><h3>Summary</h3><p>${cv.summary}</p></div>` : ''}

            <div class="cv-section">
              <h3>Education</h3>
              <p><strong>${(cv.education && cv.education.degree) || ''}</strong></p>
              <p>${(cv.education && cv.education.institution) || ''} ${(cv.education && cv.education.year) ? '(' + cv.education.year + ')' : ''}</p>
            </div>

            ${skillsList ? `<div class="cv-section"><h3>Skills</h3><div class="skills-wrap">${skillsList}</div></div>` : ''}

            ${hasExp1 ? `
            <div class="cv-section">
              <h3>Experience</h3>
              <p><strong>${cv.experience.jobTitle}</strong> - ${cv.experience.company || ''} ${cv.experience.period ? '(' + cv.experience.period + ')' : ''}</p>
              <p>${cv.experience.description || ''}</p>
            </div>` : ''}

            ${hasExp2 ? `
            <div class="cv-section">
              <p><strong>${cv.experience2.jobTitle}</strong> - ${cv.experience2.company || ''} ${cv.experience2.period ? '(' + cv.experience2.period + ')' : ''}</p>
              <p>${cv.experience2.description || ''}</p>
            </div>` : ''}

            ${hasRef ? `
            <div class="cv-section">
              <h3>Reference</h3>
              <p><strong>${cv.reference.name}</strong> ${cv.reference.title ? '- ' + cv.reference.title : ''}</p>
              <p>${cv.reference.email || ''} ${cv.reference.phone ? '| ' + cv.reference.phone : ''}</p>
            </div>` : ''}
          `;
        }
      }).catch((error) => {
        document.getElementById('cvSheet').innerHTML = "Error: " + error.message;
      });
    });

    function deleteCV() {
      if (!cvExists) {
        alert("There is no CV to delete.");
        return;
      }

      if (!confirm("Are you sure you want to delete your CV? This cannot be undone.")) {
        return;
      }

      const user = auth.currentUser;
      if (!user) return;

      db.collection('cvs').doc(user.uid).delete()
        .then(() => {
          alert("CV deleted successfully.");
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Error: " + error.message);
        });
    }
  </script>
</body>
</html>
